name: Build and Release

on:
  pull_request:
    paths-ignore:
      - 'ota/**'
      - '**/*.md'
      - 'website/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
      - 'V*'
    paths-ignore:
      - 'ota/**'
      - '**/*.md'
      - 'website/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: 'Preview release tag. Leave empty for nightly-YYYYMMDD (Asia/Shanghai).'
        required: false
        type: string
      publish_release:
        description: 'Publish the preview pre-release (compares last formal release -> current commit).'
        required: false
        default: true
        type: boolean

# PR: a new push cancels the PR's previous, now-outdated run.
# push / tag / manual runs: every run gets its own group (run_id), so none is ever cancelled or
# left pending behind another; a shared group would cancel queued runs even with
# cancel-in-progress: false, which would drop branch artifacts or releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Master switch for the whole SignPath signing chain. SignPath has not authorized
      # the signing policy for this project yet, so every signing step is skipped and
      # releases ship unsigned binaries, exactly as they did before the SignPath
      # integration landed. Flip this to 'true' once the signing policy is approved.
      # The plan step turns it into the should_sign output that build-windows reads.
      SIGNPATH_ENABLED: 'false'
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      should_publish_release: ${{ steps.plan.outputs.should_publish_release }}
      should_sign: ${{ steps.plan.outputs.should_sign }}
      release_type: ${{ steps.plan.outputs.release_type }}
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_name: ${{ steps.plan.outputs.release_name }}
      release_label: ${{ steps.plan.outputs.release_label }}
      release_date: ${{ steps.plan.outputs.release_date }}
      release_guidance: ${{ steps.plan.outputs.release_guidance }}
      build_version: ${{ steps.plan.outputs.build_version }}
      target_commitish: ${{ steps.plan.outputs.target_commitish }}
      target_branch: ${{ steps.plan.outputs.target_branch }}
      previous_stable_tag: ${{ steps.plan.outputs.previous_stable_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Needs tags and history: latest_stable_tag and has_effective_changes below.
          fetch-depth: 0

      - name: Determine release plan
        id: plan
        shell: bash
        env:
          MANUAL_PRERELEASE_TAG: ${{ github.event.inputs.prerelease_tag || '' }}
          MANUAL_PUBLISH: ${{ github.event.inputs.publish_release || 'false' }}
        run: |
          set -euo pipefail

          {
            echo "should_build=false"
            echo "should_publish_release=false"
            echo "should_sign=false"
            echo "release_type=none"
            echo "is_prerelease=false"
            echo "release_tag="
            echo "release_name="
            echo "release_label="
            echo "release_date=$(TZ=Asia/Shanghai date +%F)"
            echo "release_guidance="
            echo "build_version="
            echo "target_commitish=${GITHUB_SHA}"
            echo "target_branch=main"
            echo "previous_stable_tag="
          } >> "$GITHUB_OUTPUT"

          # Keep in sync with on.*.paths-ignore above.
          has_effective_changes() {
            local sha="$1"
            if git show --pretty="" --name-only "$sha" \
              | grep -Ev '^(ota/|website/|docs/|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|.*\.md$)' \
              | grep -q .; then
              return 0
            fi

            return 1
          }

          should_publish=false

          # Latest formal-release tag (v*/V*) reachable from the built commit.
          # The preview compares this tag -> the current commit ("all changes since the last formal release").
          latest_stable_tag=$(git tag --list 'v*' 'V*' --sort=-v:refname --merged "${GITHUB_SHA}" | head -n1 || true)

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${MANUAL_PUBLISH}" == "true" ]]; then
            should_publish=true
            today=$(TZ=Asia/Shanghai date +%Y%m%d)
            release_tag="${MANUAL_PRERELEASE_TAG:-nightly-$today}"

            {
              echo "should_build=true"
              echo "should_publish_release=true"
              echo "release_type=prerelease"
              echo "is_prerelease=true"
              echo "release_tag=$release_tag"
              echo "release_name=Pre-release $release_tag"
              echo "release_label=pre-release"
              echo "release_guidance=This is a preview pre-release covering all changes since the last formal release. Make it clear that details may still change and do not phrase it as a final stability promise."
              echo "build_version=$release_tag"
              echo "release_date=$(TZ=Asia/Shanghai date +%F)"
              echo "target_commitish=${GITHUB_SHA}"
              echo "target_branch=${GITHUB_REF_NAME}"
              echo "previous_stable_tag=$latest_stable_tag"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            # A pushed v* tag is an explicit request to release, so it always builds and
            # publishes. paths-ignore does not apply to tag pushes; this job used to skip
            # tags whose commit only touched ignored paths, which silently left a tag with
            # no release. Now that case only gets a notice.
            if ! has_effective_changes "${GITHUB_SHA}"; then
              echo "::notice::The tagged commit only touches docs/website/ota paths; publishing ${GITHUB_REF_NAME} anyway."
            fi
            should_publish=true

            normalized_tag="${GITHUB_REF_NAME#v}"
            normalized_tag="${normalized_tag#V}"
            normalized_tag_lc="${normalized_tag,,}"

            # A SignPath test tag must never look like a stable release. It
            # creates a GitHub pre-release and the final notes add an
            # explicit self-signed-certificate test notice.
            if [[ "$normalized_tag_lc" == *signpath-test* || "$normalized_tag_lc" == *-test* ]]; then
              {
                echo "should_build=true"
                echo "should_publish_release=true"
                echo "release_type=prerelease"
                echo "is_prerelease=true"
                echo "release_tag=${GITHUB_REF_NAME}"
                echo "release_name=SignPath test pre-release ${GITHUB_REF_NAME}"
                echo "release_label=SignPath test pre-release"
                echo "release_guidance=This is a SignPath integration-test pre-release. State clearly that it uses a self-signed test certificate, is not a production release, and may trigger Windows warnings. Do not describe it as stable or trusted."
                echo "build_version=$normalized_tag"
              } >> "$GITHUB_OUTPUT"
            else
              # build/config.yml info.version is the single source of the version: it goes
              # into the exe resources, the installer and the Linux packages. A release tag
              # that disagrees with it would ship binaries reporting a different version, so
              # refuse to publish. A suffixed tag (v3.9.0-rc1) must match on its x.y.z part.
              config_version=$(sed -nE 's/^[[:space:]]+version:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' build/config.yml | head -n1)
              if [[ -z "$config_version" ]]; then
                echo "::error file=build/config.yml::Could not parse info.version from build/config.yml"
                exit 1
              fi
              if [[ "${normalized_tag%%-*}" != "$config_version" ]]; then
                echo "::error file=build/config.yml::Tag ${GITHUB_REF_NAME} does not match build/config.yml info.version ${config_version}. Bump info.version in the tagged commit (or fix the tag), then re-tag."
                exit 1
              fi
              echo "Tag ${GITHUB_REF_NAME} matches build/config.yml info.version ${config_version}"

              {
                echo "should_build=true"
                echo "should_publish_release=true"
                echo "release_type=stable"
                echo "is_prerelease=false"
                echo "release_tag=${GITHUB_REF_NAME}"
                echo "release_name=${GITHUB_REF_NAME}"
                echo "release_label=formal release"
                echo "release_guidance=This is a formal release. Emphasize stable delivery and user-visible changes, but only state facts supported by the commit data."
                echo "build_version=$normalized_tag"
              } >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          # Sign exactly what gets published (tag releases and manual preview releases);
          # PR and branch artifacts stay unsigned development builds.
          if [[ "${SIGNPATH_ENABLED}" == "true" && "$should_publish" == "true" ]]; then
            echo "should_sign=true" >> "$GITHUB_OUTPUT"
          fi

  # Quality gate. Independent of prepare-release so it runs on every PR and push in
  # parallel with the builds; publish-release waits for it.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libhidapi-dev libudev-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/package.json', 'frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # main.go embeds all:frontend/dist, so the Go packages only type-check when the
      # directory has a file in it. vet/test/bindings do not need the real UI build.
      - name: Stub frontend/dist for go:embed
        run: |
          mkdir -p frontend/dist
          [ -n "$(ls -A frontend/dist)" ] || echo 'ci placeholder' > frontend/dist/.ci-placeholder

      - name: gofmt
        run: |
          # internal/bridge is excluded for now: its files predate gofmt and have
          # uncommitted local work on them. Drop the filter once that lands gofmt-clean.
          # .gitattributes checks *.go out with LF everywhere, so this is OS-independent.
          unformatted=$(git ls-files -z '*.go' | grep -zv '^internal/bridge/' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run gofmt -w):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # -short skips the hardware tests (real BLE/HID devices) that cannot run on CI.
        run: go test -short ./...

      - name: Wails bindings are up to date
        run: |
          wails3 generate bindings -clean=true -d frontend/bindings -silent . ./internal/guiapp
          # status (not diff) also catches newly generated and deleted files.
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            echo "::error::frontend/bindings is stale. Run 'wails3 task bindings' and commit the result."
            git status --porcelain -- frontend/bindings
            git diff -- frontend/bindings | head -n 200
            exit 1
          fi

      - name: TypeScript typecheck
        working-directory: frontend
        run: bun run typecheck

  build-windows:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      # The organization ID is a public SignPath identifier. Keep the API token
      # in the repository secret SIGNPATH_API_TOKEN; never put it in this file.
      # THRM [OSS] organization (not the separate Tianli trial organization).
      SIGNPATH_ORGANIZATION_ID: edf9fbb2-1f9a-4920-84d0-3b3322208d7f
      SIGNPATH_PROJECT_SLUG: thrm
      # The OSS organization currently has the self-signed test certificate.
      # Switch this to release-signing after SignPath imports the production CA
      # certificate and the corresponding policy is enabled.
      SIGNPATH_SIGNING_POLICY_SLUG: test-signing
      # The signing master switch (SIGNPATH_ENABLED) lives on prepare-release, which
      # exposes the combined decision as needs.prepare-release.outputs.should_sign.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The build reads the version from build/config.yml / THRM_BUILD_VERSION and
          # builds Go with -buildvcs=false, so no history or tags are needed here.
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install Wails CLI and go-winres
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          go install github.com/tc-hib/go-winres@v0.3.3
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE 'go\bin')

      # fluentsetup CLI + installer runtime (verified download of the pinned release), on PATH for the
      # Taskfile package task and the re-packaging after signing.
      - uses: TIANLI0/FluentSetup@v1.2.0

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            C:\Users\runneradmin\.bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/package.json', 'frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # TempBridge restores from NuGet twice per build (TempBridge and the pinned
      # LibreHardwareMonitorLib). build_bridge.bat pins the LHM commit, so hashing it
      # together with the project files tracks every dependency change.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('bridge/TempBridge/*.csproj', 'build_bridge.bat') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build TempBridge
        shell: cmd
        run: build_bridge.bat

      - name: Build THRM
        shell: cmd
        env:
          THRM_BUILD_VERSION: ${{ needs.prepare-release.outputs.build_version }}
        run: build.bat

      # Sign only release-shaped builds (should_sign, decided by prepare-release).
      # Pull requests and ordinary branch artifacts remain unsigned development
      # artifacts. Component signing
      # requests happen before installer packaging so the installer contains the
      # signed application binaries; four SignPath requests cover the three
      # Windows executables and the final installer.
      - name: Prepare THRM.exe for SignPath
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/signing-input/thrm | Out-Null
          Copy-Item build/bin/THRM.exe build/signing-input/thrm/THRM.exe -Force

      - name: Upload THRM.exe for SignPath
        id: upload-thrm
        if: needs.prepare-release.outputs.should_sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-thrm-${{ github.run_id }}
          path: build/signing-input/thrm/THRM.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign THRM.exe with SignPath
        id: sign-thrm
        if: needs.prepare-release.outputs.should_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-thrm.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: build/signed/thrm

      - name: Replace THRM.exe with the signed artifact
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem build/signed/thrm -Filter 'THRM.exe' -File -Recurse | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return THRM.exe' }
          Copy-Item $signed.FullName build/bin/THRM.exe -Force

      - name: Prepare THRM Core.exe for SignPath
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/signing-input/core | Out-Null
          Copy-Item 'build/bin/THRM Core.exe' 'build/signing-input/core/THRM Core.exe' -Force

      - name: Upload THRM Core.exe for SignPath
        id: upload-core
        if: needs.prepare-release.outputs.should_sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-thrm-core-${{ github.run_id }}
          path: 'build/signing-input/core/THRM Core.exe'
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign THRM Core.exe with SignPath
        id: sign-core
        if: needs.prepare-release.outputs.should_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-core.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: build/signed/core

      - name: Replace THRM Core.exe with the signed artifact
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem build/signed/core -Filter 'THRM Core.exe' -File -Recurse | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return THRM Core.exe' }
          Copy-Item $signed.FullName 'build/bin/THRM Core.exe' -Force

      - name: Prepare THRM TempBridge.exe for SignPath
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/signing-input/tempbridge | Out-Null
          Copy-Item 'build/bin/bridge/THRM TempBridge.exe' 'build/signing-input/tempbridge/THRM TempBridge.exe' -Force

      - name: Upload THRM TempBridge.exe for SignPath
        id: upload-tempbridge
        if: needs.prepare-release.outputs.should_sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-thrm-tempbridge-${{ github.run_id }}
          path: 'build/signing-input/tempbridge/THRM TempBridge.exe'
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign THRM TempBridge.exe with SignPath
        id: sign-tempbridge
        if: needs.prepare-release.outputs.should_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-tempbridge.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: build/signed/tempbridge

      - name: Replace THRM TempBridge.exe with the signed artifact
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem build/signed/tempbridge -Filter 'THRM TempBridge.exe' -File -Recurse | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return THRM TempBridge.exe' }
          Copy-Item $signed.FullName 'build/bin/bridge/THRM TempBridge.exe' -Force

      - name: Rebuild the installer from signed binaries
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          # Same values the Taskfile package task passes: build/config.yml version, build/windows/pawnio.env.
          $pawnioVersion = (Get-Content build/windows/pawnio.env |
            Where-Object { $_ -match '^PAWNIO_FILE_VERSION=' } |
            Select-Object -First 1) -replace '^PAWNIO_FILE_VERSION=', ''
          if (-not $pawnioVersion) { throw 'PAWNIO_FILE_VERSION missing from build/windows/pawnio.env' }
          $productVersion = (Select-String -Path build/config.yml -Pattern '^\s+version:\s*"?([^"#\s]+)"?' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $productVersion) { throw 'version missing from build/config.yml' }
          Push-Location build/windows/installer
          try {
            fluentsetup build fluentsetup.json -D "Version=$productVersion" -D "PawnIOVersion=$($pawnioVersion.Trim())" -o ../../bin
            if ($LASTEXITCODE -ne 0) { throw "fluentsetup failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Prepare installer for SignPath
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/signing-input/installer | Out-Null
          Copy-Item build/bin/THRM-amd64-installer.exe build/signing-input/installer/THRM-amd64-installer.exe -Force

      - name: Upload installer for SignPath
        id: upload-installer
        if: needs.prepare-release.outputs.should_sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-thrm-installer-${{ github.run_id }}
          path: build/signing-input/installer/THRM-amd64-installer.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        id: sign-installer
        if: needs.prepare-release.outputs.should_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: build/signed/installer

      - name: Replace installer with the signed artifact
        if: needs.prepare-release.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem build/signed/installer -Filter 'THRM-amd64-installer.exe' -File -Recurse | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return THRM-amd64-installer.exe' }
          Copy-Item $signed.FullName build/bin/THRM-amd64-installer.exe -Force

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/output | Out-Null
          Copy-Item build/bin/THRM.exe build/output/THRM.exe
          Copy-Item 'build/bin/THRM Core.exe' 'build/output/THRM Core.exe'
          Copy-Item build/bin/PawnIO_setup.exe build/output/PawnIO_setup.exe
          Copy-Item -Recurse build/bin/bridge build/output/bridge
          if (Test-Path 'build/bin/THRM-amd64-installer.exe') {
            Copy-Item 'build/bin/THRM-amd64-installer.exe' 'build/output/THRM-amd64-installer.exe'
          }
          Compress-Archive -Path build/output/* -DestinationPath build/bin/THRM-windows-portable.zip -Force

      - name: Upload PR artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: THRM-windows-${{ github.event.pull_request.number }}
          path: |
            build/bin/THRM-amd64-installer.exe
            build/bin/THRM-windows-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload branch artifacts
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v7
        with:
          name: THRM-windows-${{ github.sha }}
          path: |
            build/bin/THRM-amd64-installer.exe
            build/bin/THRM-windows-portable.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows release assets
        if: needs.prepare-release.outputs.should_publish_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            build/bin/THRM-amd64-installer.exe
            build/bin/THRM-windows-portable.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Versions come from build/config.yml and prepare-release outputs
          # (build_version, previous_stable_tag); no history or tags are needed here.
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libhidapi-dev libudev-dev
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/package.json', 'frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build THRM (Linux)
        env:
          THRM_BUILD_VERSION: ${{ needs.prepare-release.outputs.build_version }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package Linux artifacts (tar.gz + .deb)
        shell: bash
        env:
          THRM_BUILD_VERSION: ${{ needs.prepare-release.outputs.build_version }}
          PREVIOUS_STABLE_TAG: ${{ needs.prepare-release.outputs.previous_stable_tag }}
        run: |
          set -euo pipefail

          # build/config.yml 的 info.version 是版本的唯一来源；PKGBUILD 的 pkgver 由它派生，不再需要比对两者。
          # 这里只确保它真的能被解析出来，解析不出来就没必要继续打包。
          PRODUCT_VER=$(sed -nE 's/^[[:space:]]+version:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' build/config.yml | head -n1)
          if [ -z "$PRODUCT_VER" ]; then
            echo "无法从 build/config.yml 解析 info.version" >&2
            exit 1
          fi
          echo "build/config.yml info.version: $PRODUCT_VER"

          VER="${THRM_BUILD_VERSION:-$PRODUCT_VER}"
          [ -n "$VER" ] || VER="dev"
          echo "Packaging version: $VER"

          ICON_SRC="build/appicon.png"
          RULES_SRC="scripts/99-flydigi-fan.rules"
          DIST="build/dist"
          rm -rf "$DIST" build/stage build/deb
          mkdir -p "$DIST"

          # ---------- Portable tarball ----------
          STAGE="build/stage/THRM-linux-amd64"
          mkdir -p "$STAGE"
          install -Dm755 build/thrm "$STAGE/thrm"
          install -Dm755 build/thrm-core "$STAGE/thrm-core"
          install -Dm755 scripts/install-portable.sh "$STAGE/install.sh"
          [ -f "$RULES_SRC" ] && install -Dm644 "$RULES_SRC" "$STAGE/99-flydigi-fan.rules"
          [ -f "$ICON_SRC" ] && install -Dm644 "$ICON_SRC" "$STAGE/appicon.png"
          tar -czf "$DIST/THRM-linux-amd64-portable.tar.gz" -C build/stage THRM-linux-amd64
          echo "Created $DIST/THRM-linux-amd64-portable.tar.gz"

          # ---------- Debian package ----------
          # 预发布的版本号必须落在正确的升级链上，否则 apt 会拒绝升级，而且不会报错。
          # 早先固定写 0.0.0 会让每个预发布看起来都比任何正式版旧，永远升不上去。
          #
          # 分两种情形，取决于 build/config.yml 的版本有没有领先于最近一个正式版：
          #   领先（正在开发 3.7.0，上个正式版是 3.6.5）→ 3.7.0~nightly.X
          #     dpkg 里 ~ 排在空之前，于是它低于 3.7.0，将来升正式版是升级。
          #   持平（3.7.0 已发布，版本号还没往上 bump）→ 3.7.0+nightly.X
          #     此时没有"下一个版本"可依附，只能表达成 3.7.0 之后的快照。
          #     这个窗口不是罕见情况：release 提交先 bump 版本号再打 tag，
          #     所以发布之后到下次 bump 之前，两者一直是持平的。
          PREV_STABLE="${PREVIOUS_STABLE_TAG#[vV]}"
          case "$VER" in
            nightly-*)
              NIGHTLY_ID="${VER#nightly-}"
              NIGHTLY_ID="${NIGHTLY_ID//-/.}"
              if [ -n "$PREV_STABLE" ] && ! dpkg --compare-versions "$PRODUCT_VER" gt "$PREV_STABLE"; then
                DEB_VER="${PRODUCT_VER}+nightly.${NIGHTLY_ID}"
                DEB_EXPECT=gt
              else
                DEB_VER="${PRODUCT_VER}~nightly.${NIGHTLY_ID}"
                DEB_EXPECT=lt
              fi
              ;;
            v*|V*) DEB_VER="${VER#[vV]}" ;;
            *)     DEB_VER="$VER" ;;
          esac
          echo "Debian version: $DEB_VER"

          # 版本序就是这段逻辑存在的全部意义，交给 dpkg 自己判定，别靠人推断。
          if [ -n "${DEB_EXPECT:-}" ] && ! dpkg --compare-versions "$DEB_VER" "$DEB_EXPECT" "$PRODUCT_VER"; then
            echo "预发布版本 $DEB_VER 与正式版 $PRODUCT_VER 的先后关系不是 $DEB_EXPECT" >&2
            exit 1
          fi

          PKGROOT="build/deb/thrm"
          install -Dm755 build/thrm "$PKGROOT/usr/bin/thrm"
          install -Dm755 build/thrm-core "$PKGROOT/usr/bin/thrm-core"
          [ -f "$ICON_SRC" ] && install -Dm644 "$ICON_SRC" "$PKGROOT/usr/share/icons/hicolor/256x256/apps/thrm.png"
          [ -f "$RULES_SRC" ] && install -Dm644 "$RULES_SRC" "$PKGROOT/usr/lib/udev/rules.d/99-flydigi-fan.rules"
          install -Dm644 packaging/linux/thrm.desktop "$PKGROOT/usr/share/applications/thrm.desktop"

          install -d "$PKGROOT/DEBIAN"
          cat > "$PKGROOT/DEBIAN/control" << EOF
          Package: thrm
          Version: $DEB_VER
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-4-1, libwebkitgtk-6.0-4, libhidapi-hidraw0
          Recommends: bluez
          Maintainer: TIANLI0 <wutianli@tianli0.top>
          Description: THRM
           Flydigi BS series cooler and multi-brand fan controller.
          EOF

          cat > "$PKGROOT/DEBIAN/postinst" << 'EOF'
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
            udevadm control --reload-rules || true
            udevadm trigger --subsystem-match=usb --subsystem-match=hidraw || true
          fi
          # The hidraw rules fall back to GROUP="input" because uaccess only covers an
          # active local seat: Bluetooth HID hotplug and non-seat sessions (SSH, user
          # services) get no ACL. Package scripts must not edit user groups, so tell
          # the admin what to run.
          echo "THRM: for Bluetooth HID access, add your user to the input group:"
          echo '  sudo usermod -aG input $USER   # re-login afterwards'
          exit 0
          EOF
          chmod 0755 "$PKGROOT/DEBIAN/postinst"

          dpkg-deb --build --root-owner-group "$PKGROOT" "$DIST/thrm_${DEB_VER}_amd64.deb"
          echo "Created $DIST/thrm_${DEB_VER}_amd64.deb"

          ls -lh "$DIST"

      - name: Package Arch Linux artifact (.pkg.tar.zst)
        shell: bash
        env:
          THRM_BUILD_VERSION: ${{ needs.prepare-release.outputs.build_version }}
          PREVIOUS_STABLE_TAG: ${{ needs.prepare-release.outputs.previous_stable_tag }}
        run: |
          set -euo pipefail

          VER="${THRM_BUILD_VERSION:-}"
          if [ -z "$VER" ]; then
            VER=$(sed -nE 's/^[[:space:]]+version:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' build/config.yml | head -n1)
          fi
          [ -n "$VER" ] || VER="dev"

          # pacman 的 vercmp 里多出来的段一律算"更新"，没有 dpkg 那个 ~ 的写法，
          # 因此无法表达"低于 3.7.0"。改用 Arch VCS 包的通行惯例：以**上一个正式版**
          # 为基，加 .r<日期>。3.6.5.r20260818 高于 3.6.5、低于 3.7.0，升级链是对的。
          # 拿不到上一个正式版时（仓库还没发过版）才退回 0.0.0。
          case "$VER" in
            nightly-*)
              NIGHTLY_ID="${VER#nightly-}"
              ARCH_BASE="${PREVIOUS_STABLE_TAG#[vV]}"
              [ -n "$ARCH_BASE" ] || ARCH_BASE="0.0.0"
              ARCH_VER="${ARCH_BASE}.r${NIGHTLY_ID}"
              ;;
            v*|V*) ARCH_VER="${VER#[vV]}" ;;
            *)     ARCH_VER="$VER" ;;
          esac
          ARCH_VER=$(printf '%s' "$ARCH_VER" | sed -E 's/[^[:alnum:]_+.]+/./g; s/^\.+//; s/\.+$//')
          [ -n "$ARCH_VER" ] || ARCH_VER="0.0.0.dev"
          echo "Arch package version: $ARCH_VER"
          sed -i "s/^pkgver=.*/pkgver=$ARCH_VER/" PKGBUILD

          # 预发布必须高于上一个正式版、低于下一个正式版。pacman 的 vercmp 只在容器里有，
          # 顺带塞进下面那次 docker run 里校验，排错了直接让构建失败。
          NEXT_VER=$(sed -nE 's/^[[:space:]]+version:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' build/config.yml | head -n1)

          BUILDER_UID=$(id -u)
          docker run --rm \
            --env "BUILDER_UID=$BUILDER_UID" \
            --env "ARCH_CHECK_VER=$ARCH_VER" \
            --env "ARCH_CHECK_BASE=${ARCH_BASE:-}" \
            --env "ARCH_CHECK_NEXT=$NEXT_VER" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:base-devel \
            bash -euc '
              if [ -n "${ARCH_CHECK_BASE:-}" ]; then
                if [ "$(vercmp "$ARCH_CHECK_VER" "$ARCH_CHECK_BASE")" -le 0 ]; then
                  echo "预发布 $ARCH_CHECK_VER 没有高于上一个正式版 $ARCH_CHECK_BASE" >&2
                  exit 1
                fi
                # build/config.yml 与上个正式版持平时没有"下一个版本"可比，跳过上界检查。
                if [ "$(vercmp "$ARCH_CHECK_NEXT" "$ARCH_CHECK_BASE")" -gt 0 ] \
                   && [ "$(vercmp "$ARCH_CHECK_VER" "$ARCH_CHECK_NEXT")" -ge 0 ]; then
                  echo "预发布 $ARCH_CHECK_VER 没有低于下一个正式版 $ARCH_CHECK_NEXT" >&2
                  exit 1
                fi
              fi

              builder=$(getent passwd "$BUILDER_UID" | cut -d: -f1)
              if [ -z "$builder" ]; then
                useradd --create-home --uid "$BUILDER_UID" --user-group builder
                builder=builder
              fi
              runuser -u "$builder" -- env \
                BUILDDIR=/tmp/thrm-makepkg \
                PKGDEST=/workspace/build/dist \
                makepkg --clean --force --noconfirm --nodeps
            '

          ls -lh build/dist/*.pkg.tar.zst

      - name: Upload PR artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: THRM-linux-${{ github.event.pull_request.number }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.deb
            build/dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

      - name: Upload branch artifacts
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v7
        with:
          name: THRM-linux-${{ github.sha }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.deb
            build/dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux release assets
        if: needs.prepare-release.outputs.should_publish_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            build/dist/*.tar.gz
            build/dist/*.deb
            build/dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: [prepare-release, check, build-windows, build-linux]
    if: needs.prepare-release.outputs.should_publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release notes walk the commit range since the previous tag.
          fetch-depth: 0

      - name: Download Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist/windows

      - name: Download Linux release assets
        uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: dist/linux

      - name: Prepare release notes context
        id: release_context
        shell: pwsh
        env:
          RELEASE_TYPE: ${{ needs.prepare-release.outputs.release_type }}
          REPO_NAME: ${{ github.repository }}
          RELEASE_NAME: ${{ needs.prepare-release.outputs.release_name }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_LABEL: ${{ needs.prepare-release.outputs.release_label }}
          RELEASE_DATE: ${{ needs.prepare-release.outputs.release_date }}
          RELEASE_GUIDANCE: ${{ needs.prepare-release.outputs.release_guidance }}
          TARGET_COMMITISH: ${{ needs.prepare-release.outputs.target_commitish }}
          PREVIOUS_STABLE_TAG: ${{ needs.prepare-release.outputs.previous_stable_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path build/release-context | Out-Null

          $releaseType = $env:RELEASE_TYPE
          $compareSummary = ''
          $commitLines = @()
          $fileLines = @()
          $rawFileLines = @()
          $aiScopedCommitLines = @()
          $aiScopedFileLines = @()
          $codeContextLines = @()
          $rangeSpec = ''
          $allowedSourceFilePattern = '(?i)\.(go|tsx|ts|cs|csproj|nsi)$'
          $allowedPathspecs = @(
            ':(glob)**/*.go',
            ':(glob)**/*.ts',
            ':(glob)**/*.tsx',
            ':(glob)**/*.cs',
            ':(glob)**/*.csproj',
            ':(glob)**/*.nsi'
          )

          if ($releaseType -eq 'stable') {
            $currentTag = $env:RELEASE_TAG
            $previousTag = (git describe --tags --abbrev=0 "$currentTag^" 2>$null)
            if ($LASTEXITCODE -ne 0) {
              $previousTag = ''
            }
            $previousTag = "$previousTag".Trim()

            if ([string]::IsNullOrWhiteSpace($previousTag)) {
              $compareSummary = "Formal release $currentTag; no earlier tag was found, so the notes should be based on the currently visible recent commits for this tag."
              $commitLines = @(git log $currentTag --pretty=format:"- %h %s (%an, %ad)" --date=short --max-count=60)
              $fileLines = @(git log $currentTag --name-only --pretty=format: --max-count=60 | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
              $rangeSpec = "$currentTag"
            } else {
              $range = "$previousTag..$currentTag"
              $compareSummary = "Formal release $currentTag; change range $range."
              $commitLines = @(git log $range --pretty=format:"- %h %s (%an, %ad)" --date=short --max-count=60)
              $fileLines = @(git log $range --name-only --pretty=format: --max-count=60 | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
              $rangeSpec = "$range"
            }
          } else {
            $previousStableTag = "$($env:PREVIOUS_STABLE_TAG)".Trim()
            $currentRef = "$($env:TARGET_COMMITISH)".Trim()
            if ([string]::IsNullOrWhiteSpace($currentRef)) {
              $currentRef = 'HEAD'
            }

            if ([string]::IsNullOrWhiteSpace($previousStableTag)) {
              $compareSummary = "Preview pre-release $($env:RELEASE_TAG); no earlier formal release tag was found, so the notes cover the currently visible recent commits."
              $commitLines = @(git log $currentRef --pretty=format:"- %h %s (%an, %ad)" --date=short --max-count=100)
              $fileLines = @(git log $currentRef --name-only --pretty=format: --max-count=100 | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
              $rangeSpec = "$currentRef"
            } else {
              $range = "$previousStableTag..$currentRef"
              $compareSummary = "Preview pre-release $($env:RELEASE_TAG) covering all changes since the last formal release $previousStableTag (change range $range)."
              $commitLines = @(git log $range --pretty=format:"- %h %s (%an, %ad)" --date=short --max-count=100)
              $fileLines = @(git log $range --name-only --pretty=format: --max-count=100 | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
              $rangeSpec = "$range"
            }
          }

          if (-not $commitLines -or $commitLines.Count -eq 0) {
            $commitLines = @('- No commit list could be extracted. Summarize conservatively from the release scope only.')
          }

          if (-not $fileLines -or $fileLines.Count -eq 0) {
            $rawFileLines = @()
            $fileLines = @('- No file list could be extracted.')
          } else {
            $rawFileLines = @($fileLines)
            $fileLines = $fileLines | ForEach-Object { "- $_" }
          }

          $allCommitLines = @($commitLines)
          $nonUserFacingPathPattern = '^(?:\.github/|\.vscode/|scripts/|ota/|website/|internal/(?:deviceproto|ipc|logger|types|version|plugins|hotkey|powernotify|appmeta)/|docs/assets/)'
          $nonUserFacingFilePattern = '(?i)\.md$'

          $commitHasUserVisibleFiles = @{}
          foreach ($line in $allCommitLines) {
            $m = [System.Text.RegularExpressions.Regex]::Match($line, '^-\s+([0-9a-f]+)\s+')
            if (-not $m.Success) {
              continue
            }

            $shortHash = $m.Groups[1].Value
            $changedInCommit = @(git show --pretty=format: --name-only $shortHash | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
            $effectiveInCommit = @(
              $changedInCommit | Where-Object {
                ($_ -notmatch $nonUserFacingPathPattern) -and
                ($_ -notmatch $nonUserFacingFilePattern)
              }
            )
            $commitHasUserVisibleFiles[$shortHash] = ($effectiveInCommit.Count -gt 0)
          }

          $nonUserFacingCommitPattern = '(?i)^-\s+[0-9a-f]+\s+(?:chore|ci|build|test|tests|refactor|style|perf|docs|revert)(?:\([^)]+\))?:'
          $internalNoiseKeywordPattern = '(?i)(workflow|pipeline|lint|format|typo|internal only|debug log|telemetry|deps only|dependency bump|no user impact)'
          $userVisibleCommitLines = @(
            $allCommitLines | Where-Object {
              $m = [System.Text.RegularExpressions.Regex]::Match($_, '^-\s+([0-9a-f]+)\s+')
              $hasEffectiveFiles = $true
              if ($m.Success -and $commitHasUserVisibleFiles.ContainsKey($m.Groups[1].Value)) {
                $hasEffectiveFiles = [bool]$commitHasUserVisibleFiles[$m.Groups[1].Value]
              }

              $hasEffectiveFiles -and
              ($_ -notmatch $nonUserFacingCommitPattern) -and
              ($_ -notmatch $internalNoiseKeywordPattern)
            }
          )

          if (-not $userVisibleCommitLines -or $userVisibleCommitLines.Count -eq 0) {
            $userVisibleCommitLines = @('- No clearly user-visible changes could be confirmed from commit subjects. Keep notes minimal and do not infer hidden/internal changes.')
          }

          $userVisibleRawFiles = @(
            $rawFileLines | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_) -and
              ($_ -notmatch $nonUserFacingPathPattern) -and
              ($_ -notmatch $nonUserFacingFilePattern)
            }
          )
          $userVisibleFileLines = @()
          if (-not $userVisibleRawFiles -or $userVisibleRawFiles.Count -eq 0) {
            $userVisibleFileLines = @('- No clearly user-visible file changes could be confirmed. Do not list internal-only scope.')
          } else {
            $userVisibleFileLines = $userVisibleRawFiles | ForEach-Object { "- $_" }
          }

          $aiScopedRawFiles = @(
            $rawFileLines | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_) -and
              ($_ -match $allowedSourceFilePattern)
            } | Sort-Object -Unique
          )

          if (-not $aiScopedRawFiles -or $aiScopedRawFiles.Count -eq 0) {
            $aiScopedFileLines = @('- No changed files matched allowed source extensions (.go/.tsx/.ts/.cs/.csproj/.nsi).')
          } else {
            $aiScopedFileLines = $aiScopedRawFiles | ForEach-Object { "- $_" }
          }

          $commitHasAllowedFiles = @{}
          foreach ($line in $allCommitLines) {
            $m = [System.Text.RegularExpressions.Regex]::Match($line, '^-\s+([0-9a-f]+)\s+')
            if (-not $m.Success) {
              continue
            }

            $shortHash = $m.Groups[1].Value
            $changedInCommit = @(git show --pretty=format: --name-only $shortHash | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
            $allowedInCommit = @(
              $changedInCommit | Where-Object {
                $_ -match $allowedSourceFilePattern
              }
            )
            $commitHasAllowedFiles[$shortHash] = ($allowedInCommit.Count -gt 0)
          }

          $aiScopedCommitLines = @(
            $allCommitLines | Where-Object {
              $m = [System.Text.RegularExpressions.Regex]::Match($_, '^-\s+([0-9a-f]+)\s+')
              if (-not $m.Success) {
                return $false
              }
              $shortHash = $m.Groups[1].Value
              $commitHasAllowedFiles.ContainsKey($shortHash) -and [bool]$commitHasAllowedFiles[$shortHash]
            }
          )

          if (-not $aiScopedCommitLines -or $aiScopedCommitLines.Count -eq 0) {
            $aiScopedCommitLines = @('- No commits touched allowed source extensions in this release scope.')
          }

          $codeCommitHashes = @()
          if (-not [string]::IsNullOrWhiteSpace($rangeSpec)) {
            $codeCommitHashes = @(git log $rangeSpec --pretty=format:%H --max-count=60)
          }

          $maxCodeContextChars = 28000
          $codeContextCharCount = 0
          foreach ($hash in $codeCommitHashes) {
            if ([string]::IsNullOrWhiteSpace($hash)) {
              continue
            }

            $patchLines = @(git show --no-color --unified=3 --pretty=format:"commit %H %s" $hash -- $allowedPathspecs)
            if ($LASTEXITCODE -ne 0 -or -not $patchLines -or $patchLines.Count -eq 0) {
              continue
            }

            $patchText = ($patchLines -join [Environment]::NewLine).Trim()
            if ([string]::IsNullOrWhiteSpace($patchText)) {
              continue
            }

            if (($codeContextCharCount + $patchText.Length) -gt $maxCodeContextChars) {
              $codeContextLines += '- Code diff context was truncated to keep prompt size manageable.'
              break
            }

            $codeContextLines += $patchText
            $codeContextLines += ''
            $codeContextCharCount += $patchText.Length
          }

          if (-not $codeContextLines -or $codeContextLines.Count -eq 0) {
            $codeContextLines = @('- No diff hunks were available for allowed source extensions in this release scope.')
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'build/release-context/commits.txt'), $commitLines, $utf8NoBom)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'build/release-context/files.txt'), $fileLines, $utf8NoBom)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'build/release-context/user-visible-commits.txt'), $userVisibleCommitLines, $utf8NoBom)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'build/release-context/user-visible-files.txt'), $userVisibleFileLines, $utf8NoBom)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'build/release-context/ai-commits.txt'), $aiScopedCommitLines, $utf8NoBom)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'build/release-context/ai-files.txt'), $aiScopedFileLines, $utf8NoBom)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'build/release-context/code-context.txt'), $codeContextLines, $utf8NoBom)

          # Scalar prompt variables are written to files so actions/ai-inference file_input
          # can bind them without any YAML-escaping concerns.
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build/release-context/repo-name.txt'), "$($env:REPO_NAME)", $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build/release-context/release-name.txt'), "$($env:RELEASE_NAME)", $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build/release-context/release-tag.txt'), "$($env:RELEASE_TAG)", $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build/release-context/release-label.txt'), "$($env:RELEASE_LABEL)", $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build/release-context/release-date.txt'), "$($env:RELEASE_DATE)", $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build/release-context/release-guidance.txt'), "$($env:RELEASE_GUIDANCE)", $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build/release-context/compare-summary.txt'), "$compareSummary", $utf8NoBom)

      - name: Generate AI release notes
        id: ai_release_notes
        continue-on-error: true
        uses: actions/ai-inference@v2
        with:
          prompt-file: .github/prompts/release-notes.prompt.yml
          model: ${{ vars.DEEPSEEK_RELEASE_NOTES_MODEL || 'deepseek-v4-flash' }}
          endpoint: ${{ vars.DEEPSEEK_API_BASE_URL || 'https://api.deepseek.com' }}
          token: ${{ secrets.DEEPSEEK_API_KEY }}
          max-completion-tokens: 1800
          file_input: |
            repo_name: build/release-context/repo-name.txt
            release_name: build/release-context/release-name.txt
            release_tag: build/release-context/release-tag.txt
            release_label: build/release-context/release-label.txt
            release_date: build/release-context/release-date.txt
            compare_summary: build/release-context/compare-summary.txt
            release_guidance: build/release-context/release-guidance.txt
            commit_summary: build/release-context/ai-commits.txt
            changed_files: build/release-context/ai-files.txt
            code_context: build/release-context/code-context.txt

      - name: Finalize release notes
        id: finalize_notes
        shell: pwsh
        env:
          AI_RESPONSE_FILE: ${{ steps.ai_release_notes.outputs.response-file }}
          RELEASE_NAME: ${{ needs.prepare-release.outputs.release_name }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_DATE: ${{ needs.prepare-release.outputs.release_date }}
          RELEASE_LABEL: ${{ needs.prepare-release.outputs.release_label }}
        run: |
          $ErrorActionPreference = 'Stop'

          function New-FallbackNotes {
            param(
              [string]$ReleaseName,
              [string]$ReleaseTag,
              [string]$ReleaseDate,
              [string[]]$CommitLines,
              [string[]]$FileLines
            )

            $lines = @(
              "本次更新主要为日常维护与稳定性改进。",
              "This update mainly contains routine maintenance and stability improvements.",
              '',
              '## 更新亮点 / Highlights',
              '- 本次无明显的新功能变化 / No notable new features in this build.',
              '',
              '## 修复与改进 / Fixes and Improvements',
              '- 常规维护与稳定性优化 / General maintenance and stability improvements.'
            )

            return (($lines -join [Environment]::NewLine).Trim() + [Environment]::NewLine)
          }

          $requiredHeadings = @(
            '## 更新亮点 / Highlights',
            '## 修复与改进 / Fixes and Improvements'
          )

          $notes = ''
          $aiFile = $env:AI_RESPONSE_FILE

          if (-not [string]::IsNullOrWhiteSpace($aiFile) -and (Test-Path $aiFile)) {
            $candidate = (Get-Content $aiFile -Raw).Trim()
            $isValid = -not [string]::IsNullOrWhiteSpace($candidate)
            foreach ($heading in $requiredHeadings) {
              if ($candidate -notmatch [System.Text.RegularExpressions.Regex]::Escape($heading)) {
                $isValid = $false
              }
            }

            if ($isValid) {
              $notes = $candidate
            } else {
              Write-Warning 'AI release notes were empty or missing required headings. Falling back to conservative local notes.'
            }
          } else {
            Write-Warning 'No AI release notes response file was produced. Falling back to conservative local notes.'
          }

          if ([string]::IsNullOrWhiteSpace($notes)) {
            $fallbackCommitLines = @(Get-Content 'build/release-context/ai-commits.txt')
            $fallbackFileLines = @(Get-Content 'build/release-context/ai-files.txt')
            $notes = New-FallbackNotes -ReleaseName $env:RELEASE_NAME -ReleaseTag $env:RELEASE_TAG -ReleaseDate $env:RELEASE_DATE -CommitLines $fallbackCommitLines -FileLines $fallbackFileLines
          }

          if ($env:RELEASE_LABEL -eq 'SignPath test pre-release') {
            $testNotice = @(
              '> ⚠️ 测试说明：此版本仅用于验证 SignPath 自动签名链路，使用自签名测试证书，不是生产发布；Windows 默认不会信任该证书，可能显示安全提示。'
              '> ⚠️ Test notice: this build is only for validating the SignPath automated-signing pipeline. It uses a self-signed test certificate, is not a production release, and may show Windows security warnings.'
              ''
            ) -join [Environment]::NewLine
            $notes = $testNotice + [Environment]::NewLine + $notes.Trim()
          }

          $notesRelativePath = 'build/release-context/release-notes.md'
          $notesFullPath = Join-Path $PWD $notesRelativePath
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($notesFullPath, $notes.Trim() + [Environment]::NewLine, $utf8NoBom)

          "notes_path=$notesRelativePath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.prepare-release.outputs.release_name }}
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          target_commitish: ${{ needs.prepare-release.outputs.target_commitish }}
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease }}
          body_path: ${{ steps.finalize_notes.outputs.notes_path }}
          files: |
            dist/windows/*
            dist/linux/*
